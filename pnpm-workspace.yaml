# 仅用于 Theme 仓库自身的开发环境（playground 与创建包测试），
# Theme package 的依赖全部为普通语义化版本，消费项目无需 pnpm workspace。
packages:
  - playground
  - create-clarity-theme

# pnpm 会在部分 Nuxt 子包上下文中为 unctx 解析到旧 optional peers。
# 开发 workspace 统一锁定满足 unctx@3 声明的版本；该配置不会进入 npm 包。
overrides:
  oxc-parser: '0.149.0'
  unplugin: '3.4.0'

# 仅作用于 Theme 仓库自身的开发环境安装
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  oxc-resolver: true
  rolldown: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
