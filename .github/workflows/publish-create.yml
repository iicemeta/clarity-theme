# Independent npm publish pipeline for create-clarity-theme.
#
# Creator releases use create-v<version> tags so they never collide with the
# clarity-theme v<version> release tags handled by publish.yml.

name: Publish create-clarity-theme

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-create-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish create-clarity-theme
    if: startsWith(github.ref, 'refs/tags/create-v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: npm
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Resolve expected version tag
        id: version
        run: |
          set -euo pipefail
          version="$(jq -r '.version' create-clarity-theme/package.json)"
          expected="create-v${version}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "expected-tag=${expected}" >> "$GITHUB_OUTPUT"

          if [[ "${version}" == *-* ]]; then
            echo "dist-tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
          fi

          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match create-clarity-theme ${expected}"
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/${expected}" >/dev/null; then
            echo "::error::Git tag ${expected} does not exist in this checkout"
            exit 1
          fi

      - name: Validate creator package contract
        run: |
          set -euo pipefail
          test "$(jq -r '.name' create-clarity-theme/package.json)" = "create-clarity-theme"
          test "$(jq -r '.type' create-clarity-theme/package.json)" = "module"
          test "$(jq -r '.bin["create-clarity-theme"]' create-clarity-theme/package.json)" = "./src/cli.mjs"
          test -f create-clarity-theme/src/cli.mjs
          test -f create-clarity-theme/templates/default/package.json
          test -f create-clarity-theme/templates/default/clarity.config.ts
          test -f create-clarity-theme/templates/default/content/posts/welcome.md
          grep -F "## $(jq -r '.version' create-clarity-theme/package.json)" create-clarity-theme/CHANGELOG.md >/dev/null

      - name: Resolve Node version from engines.node
        id: node
        run: |
          set -euo pipefail
          engines_node="$(jq -r '.engines.node // empty' create-clarity-theme/package.json)"
          primary=''
          while IFS= read -r part; do
            range="$(printf '%s' "$part" | tr -d '[:space:]')"
            [ -n "$range" ] || continue
            if [[ "$range" =~ ^[\^~]?([0-9]+)\.([0-9]+)(\.[0-9]+)?$ ]]; then
              primary="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            fi
          done <<< "${engines_node//||/$'\n'}"
          if [ -z "$primary" ]; then
            echo "::error::Unable to resolve a stable Node version from ${engines_node}"
            exit 1
          fi
          echo "primary=${primary}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.primary }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Create CLI behavior tests
        run: pnpm test:create

      - name: Generated consumer E2E
        run: pnpm test:create:e2e

      - name: Packed creator tarball E2E
        run: pnpm test:create:tarball

      - name: Pack final creator tarball
        run: |
          mkdir -p artifacts/create
          pnpm --dir create-clarity-theme pack --pack-destination artifacts/create
          tarball="artifacts/create/create-clarity-theme-${{ steps.version.outputs.version }}.tgz"
          test -f "$tarball"

      - name: Audit final creator tarball
        run: |
          tarball="artifacts/create/create-clarity-theme-${{ steps.version.outputs.version }}.tgz"
          echo "## create-clarity-theme publication audit" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tar -tzf "$tarball" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$tarball" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: npm publish dry run
        run: npm publish ./artifacts/create/create-clarity-theme-${{ steps.version.outputs.version }}.tgz --access public --provenance --tag ${{ steps.version.outputs.dist-tag }} --dry-run

      - name: Publish to npm with Trusted Publishing
        run: npm publish ./artifacts/create/create-clarity-theme-${{ steps.version.outputs.version }}.tgz --access public --provenance --tag ${{ steps.version.outputs.dist-tag }}

      - name: Publication summary
        run: |
          {
            echo "## Published create-clarity-theme@${{ steps.version.outputs.version }}"
            echo ''
            echo "- Git tag: \`${{ steps.version.outputs.expected-tag }}\`"
            echo "- npm dist-tag: \`${{ steps.version.outputs.dist-tag }}\`"
            echo "- Provenance: OIDC Trusted Publishing without an NPM_TOKEN"
            echo "- Verify with: \`npm view create-clarity-theme@${{ steps.version.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
