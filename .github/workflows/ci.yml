name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: Lint / Typecheck / Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm lint
      - run: pnpm verify
      - run: pnpm typecheck

  build:
    name: Playground Generate + Real Consumer (Node 24)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - name: Playground generate
        run: pnpm generate

      - name: Real consumer test（pack → 安装 tarball → generate → 断言）
        run: pnpm test:consumer
